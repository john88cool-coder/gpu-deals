name: benchmarks
# Ежемесячное обновление справочника рейтинга PassMark: два запроса, CSV
# коммитится в репозиторий. Уведомления читают локальный файл и от доступности
# PassMark в момент отправки не зависят. Баллы меняются раз в месяцы, чаще
# читать бессмысленно.
on:
  schedule:
    - cron: '23 5 8 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: uv sync

      - name: Обновить справочник
        run: uv run gpu-deals refresh-benchmarks

      - name: Сохранить справочник
        run: |
          git config user.name "gpu-deals"
          git config user.email "actions@users.noreply.github.com"
          git add src/gpudeals/data/gpu_benchmarks.csv
          git diff --cached --quiet || git commit -m "benchmarks [skip ci]"
          git push
