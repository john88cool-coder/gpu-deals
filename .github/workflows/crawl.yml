name: crawl
# Полный обход всех магазинов каждые 2 часа. База коммитится в репозиторий,
# чтобы история цен жила между запусками.
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Кэш браузера Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Зависимости
        # dl.google.com в apt-источниках раннера периодически отдаёт hash
        # mismatch — ретрай через минуту решает (бой 2026-09-09: crawl упал,
        # обход не начался).
        run: |
          uv sync --extra dns
          uv run playwright install --with-deps chromium             || { sleep 60; sudo apt-get update; uv run playwright install --with-deps chromium; }

      - name: Обход
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GPUDEALS_DB: ${{ github.workspace }}/data/prices.sqlite3
        run: uv run gpu-deals crawl

      - name: Сохранить базу
        if: always()  # наблюдения и недоставленные алерты переживают отказ Telegram
        run: |
          git config user.name "gpu-deals"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.sqlite3
          git diff --cached --quiet || git commit -m "prices [skip ci]"
          git push
