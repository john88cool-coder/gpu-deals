name: heartbeat
# Ежедневная строка о живости: 09:00 по Алматы = 03:00 UTC (UTC+5 без перевода часов).
# Своего обхода не делает — читает итоги последних обходов из базы, поэтому ни
# Playwright, ни Chromium здесь не нужны.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: uv sync

      - name: Сводка
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GPUDEALS_DB: ${{ github.workspace }}/data/prices.sqlite3
        run: uv run gpu-deals heartbeat
