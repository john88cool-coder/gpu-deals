name: watchlist
# Быстрая проверка избранных моделей каждые 20 минут. Без DNS: браузерный
# обход слишком тяжёлый для частого цикла, DNS участвует в двухчасовом crawl.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watchlist
  cancel-in-progress: false

jobs:
  watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: uv sync

      - name: Проверка watchlist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GPUDEALS_DB: ${{ github.workspace }}/data/prices.sqlite3
        run: uv run gpu-deals watchlist --shop technodom --shop shop.kz --shop sulpak --shop forcecom --shop e-katalog --shop kaspi

      - name: Сохранить базу
        run: |
          git config user.name "gpu-deals"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.sqlite3
          git diff --cached --quiet || git commit -m "watchlist [skip ci]"
          git push
